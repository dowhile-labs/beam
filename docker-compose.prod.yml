services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BEAM_WEB_ORIGIN: ${BEAM_WEB_ORIGIN:-http://localhost:3001}
      PORT: 3000
    depends_on:
      - redis

  mcp:
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      BEAM_API_URL: ${BEAM_API_URL:-https://beam.dowhilelabs.dev}
      PORT: 3100
    depends_on:
      - api

volumes:
  redis-data:
