services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BEAM_WEB_ORIGIN: http://localhost:3001
      PORT: 3000
    depends_on:
      - redis

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
  mcp:
    restart: unless-stopped
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    ports:
      - "3100:3100"
    environment:
      BEAM_API_URL: ${BEAM_API_URL:-https://beam.dowhilelabs.dev}
      PORT: 3100

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3100/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
volumes:
  redis-data:
