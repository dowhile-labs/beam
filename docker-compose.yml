services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BEAM_WEB_ORIGIN: http://localhost:3001
      PORT: 3000
    depends_on:
      - redis

  mcp:
    restart: unless-stopped
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    ports:
      - "3100:3100"
    environment:
      BEAM_API_URL: ${BEAM_API_URL:-https://beam.dowhilelabs.dev}
      PORT: 3100

volumes:
  redis-data:
